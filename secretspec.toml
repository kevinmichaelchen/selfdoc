# Cloud TTS keys for the Voice panel, resolved by secretspec so they live in
# your OS keyring instead of a .env file or the browser:
#   secretspec set ELEVENLABS_API_KEY
#   secretspec run -- pnpm dev
# See docs/adr/0002-api-key-handling.md.
[project]
name = "selfdoc"
revision = "1.0"

[profiles.default]
ELEVENLABS_API_KEY = { description = "ElevenLabs key for synthetic narration", required = false }
FISH_API_KEY = { description = "Fish Audio key for synthetic narration", required = false }
